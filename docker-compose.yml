version: '3.8'

services:
  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: gvk_libretranslate
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - LT_LOAD_ONLY=tr,en  # Only load Turkish and English models
    volumes:
      - ./libretranslate_data:/home/libretranslate/.local
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/languages || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

